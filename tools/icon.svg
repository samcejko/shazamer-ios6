<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Shazamer: classic blue iOS 6 tile with the official Shazam logo (the gloss is baked in, UIPrerenderedIcon is on) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38b6ff"/>
      <stop offset="0.55" stop-color="#0088ff"/>
      <stop offset="1" stop-color="#004fb3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f3fc"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background tile -->
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <!-- Top rim highlight -->
  <rect x="0" y="0" width="1024" height="6" fill="#ffffff" fill-opacity="0.25"/>

